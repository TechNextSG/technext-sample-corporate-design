<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nexi, TechNext's AI companion</title>
<link rel="canonical" href="https://technext.asia/nexi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#3167CA; --blue-700:#1E4691; --blue-300:#6FA0F5; --blue-100:#DDE7F8; --blue-050:#EAF0FB;
  --ink:#1F1F3D; --body:#4C4C63; --label:#5C5C73; --line:#E7E4E9; --paper:#FFFFFF;
  --sky-1:#E4EDFD; --sky-2:#C7D8F6; --sky-3:#9FBBEC;
  --violet:#6A5AE0; --teal:#15866F; --odoo:#714B67; --ok:#137A4A; --ok-050:#E8F5EE;
  --shadow:0 2px 6px rgba(31,31,61,.06),0 30px 60px -30px rgba(30,70,145,.5);
  --font-display:"Plus Jakarta Sans",Inter,system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --panel:396px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--blue-300);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:18px;height:18px;flex:none}
.oi{display:inline-grid;place-items:center;flex:none;width:18px;height:18px}
.oi svg{width:100%;height:100%;display:block}

.app{position:relative;height:100%;min-height:560px;overflow:hidden;--sheet:52%}
.stage{position:absolute;inset:0;background:
  radial-gradient(46% 38% at 36% 42%,rgba(240,246,255,.85) 0%,rgba(240,246,255,0) 70%),
  radial-gradient(120% 95% at 38% 36%,var(--sky-1) 0%,var(--sky-2) 48%,var(--sky-3) 100%)}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.loading{position:absolute;left:0;right:calc(var(--panel) + 40px);top:44%;margin:0;text-align:center;color:var(--blue-700);font-weight:600;transition:opacity .4s}
.nowebgl{position:absolute;left:24px;right:calc(var(--panel) + 48px);top:45%;text-align:center;color:var(--label);font-weight:500}

/* cinematic letterbox for camera shots */
.bars{position:absolute;inset:0;z-index:3;pointer-events:none}
.bars i{position:absolute;left:0;right:0;height:0;background:linear-gradient(#0d1a3d,#16295c);transition:height .7s var(--ease)}
.bars i:first-child{top:0}.bars i:last-child{bottom:0}
.bars.on i{height:7.5%}

/* TechNext logo: the paper plane can fly off to visit Nexi */
.brand{position:absolute;left:22px;top:18px;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:0;border-radius:14px;background:transparent;cursor:pointer;transition:background .2s}
.brand:hover{background:rgba(255,255,255,.45)}
.brand .b-plane{height:24px;width:auto;display:block;transition:transform .35s var(--ease),opacity .25s}
.brand .b-text{height:22px;width:auto;display:block}
.brand:hover .b-plane{transform:translate(3px,-3px) rotate(-6deg)}
.brand.away .b-plane{opacity:0;transform:translate(26px,-18px) scale(.6) rotate(-20deg)}
.brand.back .b-plane{animation:planeBack .5s var(--ease)}
@keyframes planeBack{0%{opacity:0;transform:translate(-18px,10px) scale(.6)}60%{opacity:1;transform:translate(2px,-2px) scale(1.15)}100%{transform:none}}
.brand .tip{position:absolute;left:100%;top:50%;margin-left:6px;transform:translateY(-50%);white-space:nowrap;font:600 11.5px/1 var(--font-body);color:var(--blue-700);background:rgba(255,255,255,.85);padding:6px 9px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.brand:hover .tip{opacity:1}

/* labels pinned to 3D points */
.tags{position:absolute;inset:0;z-index:4;pointer-events:none}
.tag3{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(255,255,255,.95);border:1px solid #fff;box-shadow:0 8px 20px -12px rgba(30,70,145,.6);color:var(--ink);font:600 13.5px/1.1 var(--font-body);opacity:0;transition:opacity .3s var(--ease),background .2s,color .2s;will-change:transform}
.tag3.on{opacity:1}
.tag3.on.far{opacity:.4}
.tag3 .oi,.tag3 .ic{width:18px;height:18px}
.tag3 .icons{display:inline-flex;gap:2px}
.tag3 small{font-weight:500;color:var(--label);font-size:12px}
button.tag3{cursor:pointer;pointer-events:none}
button.tag3.on{pointer-events:auto}
button.tag3.on:hover{background:#fff;border-color:var(--blue-100)}
.tag3.now{background:var(--blue);border-color:var(--blue);color:#fff}
.tag3.now small{color:rgba(255,255,255,.85)}
div.tag3:not(.now) small{display:none}
.tag3 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue-050);color:var(--blue);font:800 11.5px/1 var(--font-display)}
.tag3.now .n{background:#fff}

/* floating hearts, notes and word pops */
.fx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.fx i{position:absolute;left:0;top:0;font:800 24px/1 var(--font-display);font-style:normal;color:var(--blue);text-shadow:0 2px 0 #fff,0 0 14px rgba(255,255,255,.95);animation:fxUp 1.7s var(--ease) forwards}
.fx i.heart{color:#ff5f9e}
.fx i.z{color:var(--blue-700);font-size:20px}
.fx b{position:absolute;left:0;top:0;padding:7px 14px;border-radius:16px;background:#fff;color:var(--blue);font:800 19px/1 var(--font-display);letter-spacing:.01em;white-space:nowrap;box-shadow:0 12px 26px -12px rgba(30,70,145,.65),0 0 0 3px rgba(111,160,245,.35);animation:wordPop 1.9s var(--ease) forwards}
@keyframes fxUp{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(1.15) rotate(var(--r))}}
@keyframes wordPop{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3) rotate(-14deg)}14%{opacity:1;transform:translate(var(--x),var(--y)) scale(1.18) rotate(-5deg)}24%{transform:translate(var(--x),var(--y)) scale(1) rotate(-4deg)}78%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) - 34px)) scale(.94) rotate(-4deg)}}

.hint{position:absolute;left:26px;bottom:22px;z-index:4;margin:0;font-size:12.5px;color:var(--blue-700);display:flex;gap:6px;align-items:center;pointer-events:none;transition:opacity .3s}
.hint b{font-weight:700}
body.tut-open .hint,body.shot .hint{opacity:0}

/* ---------------- chat panel: light and quiet ---------------- */
.chat{position:absolute;right:20px;top:20px;bottom:20px;width:var(--panel);z-index:6;display:flex;flex-direction:column;background:#fff;border:1px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.chat-head{display:flex;align-items:center;gap:11px;padding:14px 14px 12px 16px;border-bottom:1px solid #EEF1F6;background:#fff}
.ava{position:relative;width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe6f3 72%);box-shadow:inset 0 -2px 4px rgba(31,31,61,.1),0 0 0 1px #E3E9F4}
.ava::before{content:"";position:absolute;left:7px;right:7px;top:11px;height:16px;border-radius:8px;background:#0b0f1e}
.ava::after{content:"";position:absolute;top:14.5px;left:13px;width:4px;height:9px;border-radius:2px;background:#9ccbff;box-shadow:8px 0 0 #9ccbff,0 0 6px #6fa0f5;animation:avaBlink 4.5s infinite}
@keyframes avaBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
.ava i{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:50%;background:#2fd07f;border:2px solid #fff}
.who{display:grid;gap:1px;min-width:0}
.who b{font:800 16px/1.2 var(--font-display);color:var(--ink)}
.who span{font-size:12px;color:var(--label)}
.snd{margin-left:auto;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid #E6EAF2;background:#fff;color:var(--label);cursor:pointer;transition:background .15s,color .15s}
.snd:hover{background:var(--blue-050);color:var(--blue-700)}
.snd svg{width:17px;height:17px}
.snd .off{display:none}
.snd[aria-pressed="false"] .on{display:none}
.snd[aria-pressed="false"] .off{display:block}

.log{flex:1;min-height:120px;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;background:#fff;scrollbar-width:thin;scrollbar-color:#DDE3EE transparent}
.day{display:none}
.row{display:flex;gap:8px;align-items:flex-end;animation:msgIn .34s var(--ease) both}
.row.user{justify-content:flex-end}
.row .mini{width:24px;height:24px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe6f3 72%);box-shadow:0 0 0 1px #E3E9F4;position:relative}
.row .mini::before{content:"";position:absolute;left:4px;right:4px;top:7px;height:10px;border-radius:5px;background:#0b0f1e}
.row .mini::after{content:"";position:absolute;top:9px;left:8px;width:2.5px;height:5.5px;border-radius:2px;background:#9ccbff;box-shadow:5.5px 0 0 #9ccbff}
.msg{max-width:86%;padding:10px 13px;font-size:14px;line-height:1.55;border-radius:16px;overflow-wrap:anywhere}
.row.bot .msg{background:#F3F6FB;color:var(--ink);border-bottom-left-radius:5px}
.row.user .msg{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg b{font-weight:700}
.msg a{color:var(--blue);font-weight:600}
.msg .mail{font-weight:600;-webkit-user-select:all;user-select:all}
/* lists: a hanging indent so wrapped lines line up with the text, not the marker */
.msg ul,.msg ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.msg li{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:8px;align-items:start}
.msg li>.oi,.msg li>.ic{width:18px;height:18px;margin-top:1px}
.msg ul li:not(:has(>.oi,>.ic))::before{content:"";width:6px;height:6px;margin:8px 0 0 6px;border-radius:50%;background:var(--blue)}
.msg ol{counter-reset:n}
.msg ol li{counter-increment:n;grid-template-columns:22px minmax(0,1fr)}
.msg ol li::before{content:counter(n);display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px #DCE5F5;color:var(--blue-700);font:800 12px/1 var(--font-display)}
.msg li>span{min-width:0}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--blue-300);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0 32px;animation:msgIn .3s var(--ease) both}
.act{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid #DCE5F5;background:#fff;color:var(--blue-700);font-weight:600;font-size:12.5px;line-height:1.2;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.act:hover{background:var(--blue-050);border-color:var(--blue-300)}
.act .ic,.act .oi{width:14px;height:14px}
.act.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.act.primary:hover{background:var(--blue-700)}

.quick{padding:8px 14px 2px;background:#fff}
.quick .lbl{display:block;font:600 11px/1 var(--font-body);color:var(--label);margin:0 0 7px 2px}
.follow{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:opacity .2s}
.follow.wait{opacity:.45;pointer-events:none}
.follow.fresh .chip{animation:chipIn .32s var(--ease) both}
.follow.fresh .chip:nth-child(2){animation-delay:.04s}.follow.fresh .chip:nth-child(3){animation-delay:.08s}.follow.fresh .chip:nth-child(4){animation-delay:.12s}
@keyframes chipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid #DCE5F5;background:#fff;color:var(--blue-700);font-weight:600;font-size:12.5px;line-height:1.25;cursor:pointer;text-align:left;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s var(--ease)}
.chip:hover:not(:disabled){background:var(--blue-050);border-color:var(--blue-300)}
.chip:active:not(:disabled){transform:scale(.97)}
.chip:disabled{opacity:.5;cursor:default}
.chip .ic,.chip .oi{width:14px;height:14px}
.chip.goal{background:var(--blue-050);border-color:var(--blue-300)}
.chip.tour .ic{color:var(--violet)}
.chip.suggest{box-shadow:0 0 0 3px rgba(111,160,245,.3);border-color:var(--blue)}
.composer{display:flex;gap:8px;padding:10px 14px 8px;background:#fff}
.composer input{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:999px;border:1px solid #DCE3EF;background:#F7F9FC;color:var(--ink);font-size:14.5px;transition:border-color .15s,background .15s,box-shadow .15s}
.composer input::placeholder{color:#8b90a8}
.composer input:focus{outline:none;border-color:var(--blue-300);background:#fff;box-shadow:0 0 0 4px rgba(111,160,245,.18)}
.send{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;transition:background .15s,transform .15s var(--ease),opacity .15s}
.send:hover:not(:disabled){background:var(--blue-700)}
.send:active:not(:disabled){transform:scale(.94)}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
.foot{margin:0;padding:0 16px 12px;display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:11.5px;color:var(--label);background:#fff}
.foot a,.foot span{display:inline-flex;align-items:center;gap:5px}
.foot a{color:var(--label);font-weight:500;text-decoration:none}
.foot a:hover{color:var(--blue-700);text-decoration:underline}
.foot .ic{width:13px;height:13px}
.foot .mail{-webkit-user-select:all;user-select:all}

/* ---------------- tutorial card ---------------- */
.tut{position:absolute;z-index:5;bottom:22px;left:calc((100% - var(--panel) - 40px) / 2);width:min(470px,calc(100% - var(--panel) - 88px));padding:16px 18px 18px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:var(--shadow);opacity:0;transform:translate(-50%,16px) scale(.98);transition:opacity .32s var(--ease),transform .38s var(--ease)}
.tut.show{opacity:1;transform:translate(-50%,0)}
.tut-in{animation:swap .34s var(--ease) both}
@keyframes swap{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
.tut-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kicker{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
.tut-x{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--label);cursor:pointer}
.tut-x:hover{color:var(--ink);border-color:var(--blue-100)}
.tut-x .ic{width:15px;height:15px}
.tut h3{margin:8px 0 4px;font:700 20px/1.25 var(--font-display);text-wrap:balance}
.tut .lead{margin:0 0 12px;color:var(--body);font-size:14.5px;line-height:1.55}
.tut-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px;line-height:1.2;cursor:pointer;box-shadow:0 10px 22px -12px rgba(49,103,202,.75);transition:background .18s,transform .18s var(--ease)}
.btn:hover:not(:disabled){background:var(--blue-700)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--blue-050)}
.btn:disabled{opacity:.45;cursor:default}
.btn .ic{width:17px;height:17px}
.svc-row{display:flex;flex-wrap:wrap;gap:8px}
.svc{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:border-color .18s,box-shadow .18s}
.svc .icons{display:inline-flex;gap:2px}
.svc .icons .ic{color:var(--c)}
.svc .tick{width:15px;height:15px;color:var(--ok)}
.svc:hover{border-color:color-mix(in srgb,var(--c) 45%,#fff)}
.svc.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.svc-info{margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff)}
.svc-info b{font:700 15px/1.3 var(--font-display);color:var(--c)}
.svc-info p{margin:3px 0 0;color:var(--body);font-size:14px}
.tags-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags-list li{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid color-mix(in srgb,var(--c,var(--blue)) 25%,#fff);color:var(--ink);font-weight:600;font-size:12.5px}
.tags-list li:has(.oi,.ic){padding-left:7px}
.tags-list .oi,.tags-list .ic{width:16px;height:16px}
.tags-list .ic{color:var(--c,var(--blue))}
.step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.app-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;background:#F6F0F4;color:var(--odoo);font-weight:600;font-size:12.5px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--blue-100);transition:background .25s,width .3s var(--ease)}
.steps i.on{background:var(--blue)}
.steps i.now{width:34px}
.mini-bill{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(31,31,61,.4)}
.mb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mb-top b{display:inline-flex;align-items:center;gap:8px;font:700 14.5px/1.3 var(--font-display)}
.mb-top .ic{color:var(--blue)}
.ex{padding:3px 8px;border-radius:999px;background:#FDF6E9;color:#8A5A00;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mb-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--label);font-variant-numeric:tabular-nums}
.mb-total{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.mb-total b{font-weight:700}
.fields{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fields li{display:grid;grid-template-columns:86px minmax(0,1fr) 18px;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;animation:fieldIn .4s var(--ease) both;animation-delay:var(--d,0s)}
.fields li span{color:var(--label);font-size:12.5px}
.fields li b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fields li .ic{width:16px;height:16px;color:var(--ok)}
.fields li.match{grid-template-columns:18px minmax(0,1fr);background:var(--ok-050);border-color:#CDE9D9;color:var(--ok);font-weight:600}
@keyframes fieldIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.done-note{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ok-050);color:var(--ok);font-weight:600;font-size:14px}
.done-note .ic{width:18px;height:18px}

@media (max-width:820px){
  body.tut-open .app{--sheet:36%}
  .chat{left:0;right:0;bottom:0;top:auto;width:auto;height:var(--sheet);border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .35s var(--ease)}
  .chat-head{padding:10px 12px}
  .ava{width:32px;height:32px}

/* ================= v2: places, dock, title cards, refreshed chat ================= */
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease);pointer-events:none}
.sky.on{opacity:1}
.veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease);background:radial-gradient(120% 90% at 40% 30%,rgba(16,22,64,.25),rgba(8,10,40,.62));mix-blend-mode:multiply}
.veil.on{opacity:1}
.veil.rain::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(70,90,130,.18),rgba(40,60,100,.28))}
.warp{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 36% 52%,#fff 0,rgba(255,255,255,.9) 18%,rgba(190,215,255,.55) 42%,rgba(255,255,255,0) 72%)}

@keyframes warp{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.35)}}
body.party .sky.on{animation:partyHue 2.4s linear infinite}
@keyframes partyHue{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}

/* dark places: light chrome on the stage */

/* dock: places (top row) + play (bottom row), bottom-left of the stage */
.dock{position:absolute;z-index:6;left:20px;bottom:18px;display:grid;gap:8px;max-width:calc(100% - var(--panel) - 80px);transition:opacity .3s,transform .3s var(--ease)}
.dock-row{display:flex;gap:6px;flex-wrap:wrap;padding:6px;border-radius:20px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px -18px rgba(20,40,110,.55);width:max-content;max-width:100%}

.pl,.pb{position:relative;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 8px;border-radius:14px;border:0;background:transparent;color:var(--ink);font:700 12.5px/1 var(--font-display);cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,transform .18s var(--ease),box-shadow .18s}

.placecard{position:absolute;z-index:6;left:calc((100% - var(--panel) - 40px) / 2);top:16%;transform:translate(-50%,10px);display:grid;justify-items:center;gap:6px;pointer-events:none;opacity:0;text-align:center}
